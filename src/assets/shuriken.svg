<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {}
    </style>
  </defs>

  <g transform="translate(100,100)">

    <!-- 6 sharp blades rotated 60deg apart -->
    <!-- Each blade: narrow diamond pointing outward with dark/light faces -->

    <!-- Blade 1: 0deg (up) -->
    <polygon points="0,-14  7,-35  0,-85  -7,-35" fill="#2a2a3e"/>
    <polygon points="0,-14  -7,-35  0,-85" fill="#1a1a2e"/>
    <polygon points="0,-14  7,-35  0,-85" fill="#3d3d58"/>
    <polygon points="0,-85  2,-60  0,-14" fill="#7777aa" opacity="0.35"/>
    <polygon points="0,-85  1.5,-76  -1,-72" fill="#bbbbdd" opacity="0.55"/>

    <!-- Blade 2: 60deg -->
    <g transform="rotate(60)">
      <polygon points="0,-14  7,-35  0,-85  -7,-35" fill="#2a2a3e"/>
      <polygon points="0,-14  -7,-35  0,-85" fill="#1a1a2e"/>
      <polygon points="0,-14  7,-35  0,-85" fill="#3d3d58"/>
      <polygon points="0,-85  2,-60  0,-14" fill="#7777aa" opacity="0.35"/>
      <polygon points="0,-85  1.5,-76  -1,-72" fill="#bbbbdd" opacity="0.55"/>
    </g>

    <!-- Blade 3: 120deg -->
    <g transform="rotate(120)">
      <polygon points="0,-14  7,-35  0,-85  -7,-35" fill="#2a2a3e"/>
      <polygon points="0,-14  -7,-35  0,-85" fill="#1a1a2e"/>
      <polygon points="0,-14  7,-35  0,-85" fill="#3d3d58"/>
      <polygon points="0,-85  2,-60  0,-14" fill="#7777aa" opacity="0.35"/>
      <polygon points="0,-85  1.5,-76  -1,-72" fill="#bbbbdd" opacity="0.55"/>
    </g>

    <!-- Blade 4: 180deg -->
    <g transform="rotate(180)">
      <polygon points="0,-14  7,-35  0,-85  -7,-35" fill="#2a2a3e"/>
      <polygon points="0,-14  -7,-35  0,-85" fill="#1a1a2e"/>
      <polygon points="0,-14  7,-35  0,-85" fill="#3d3d58"/>
      <polygon points="0,-85  2,-60  0,-14" fill="#7777aa" opacity="0.35"/>
      <polygon points="0,-85  1.5,-76  -1,-72" fill="#bbbbdd" opacity="0.55"/>
    </g>

    <!-- Blade 5: 240deg -->
    <g transform="rotate(240)">
      <polygon points="0,-14  7,-35  0,-85  -7,-35" fill="#2a2a3e"/>
      <polygon points="0,-14  -7,-35  0,-85" fill="#1a1a2e"/>
      <polygon points="0,-14  7,-35  0,-85" fill="#3d3d58"/>
      <polygon points="0,-85  2,-60  0,-14" fill="#7777aa" opacity="0.35"/>
      <polygon points="0,-85  1.5,-76  -1,-72" fill="#bbbbdd" opacity="0.55"/>
    </g>

    <!-- Blade 6: 300deg -->
    <g transform="rotate(300)">
      <polygon points="0,-14  7,-35  0,-85  -7,-35" fill="#2a2a3e"/>
      <polygon points="0,-14  -7,-35  0,-85" fill="#1a1a2e"/>
      <polygon points="0,-14  7,-35  0,-85" fill="#3d3d58"/>
      <polygon points="0,-85  2,-60  0,-14" fill="#7777aa" opacity="0.35"/>
      <polygon points="0,-85  1.5,-76  -1,-72" fill="#bbbbdd" opacity="0.55"/>
    </g>

    <!-- decorative center connectors (like blade 4 reference) -->
    <g transform="rotate(30)">
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="#222235"/>
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="none" stroke="#555570" stroke-width="0.5"/>
    </g>
    <g transform="rotate(90)">
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="#222235"/>
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="none" stroke="#555570" stroke-width="0.5"/>
    </g>
    <g transform="rotate(150)">
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="#222235"/>
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="none" stroke="#555570" stroke-width="0.5"/>
    </g>
    <g transform="rotate(210)">
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="#222235"/>
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="none" stroke="#555570" stroke-width="0.5"/>
    </g>
    <g transform="rotate(270)">
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="#222235"/>
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="none" stroke="#555570" stroke-width="0.5"/>
    </g>
    <g transform="rotate(330)">
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="#222235"/>
      <rect x="-3" y="-22" width="6" height="10" rx="1" fill="none" stroke="#555570" stroke-width="0.5"/>
    </g>

    <!-- center hub -->
    <circle r="20" fill="#1c1c2e" stroke="#4a4a6e" stroke-width="1.5"/>
    <circle r="17" fill="none" stroke="#6666aa" stroke-width="0.7" opacity="0.5"/>
    <circle r="14" fill="#111120"/>
    <!-- large center hole like reference -->
    <circle r="10" fill="#07070f" stroke="#33335a" stroke-width="1"/>
    <circle r="8" fill="none" stroke="#55557a" stroke-width="0.5" opacity="0.5"/>
    <!-- glint -->
    <ellipse cx="-4" cy="-4" rx="3.5" ry="2" fill="#9999cc" opacity="0.35" transform="rotate(-40,-4,-4)"/>

  </g>
</svg>
